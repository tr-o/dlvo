[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlvo"
version = "0.1.0"
description = "DLVO interaction energies for identical colloidal spheres"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.6"]

[project.optional-dependencies]
research = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
dlvo = "dlvo.__main__:main"

[tool.setuptools.packages.find]
include = ["dlvo*"]
